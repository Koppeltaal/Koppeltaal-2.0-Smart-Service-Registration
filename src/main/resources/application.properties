spring.config.import=optional:classpath:application-secrets.properties

server.port=8086
server.servlet.session.timeout=120m

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/auth_server_dev
spring.datasource.driver-class-name=org.postgresql.Driver

smartservice.allowHttpHosts=false
jwk.provider.factory.issuer.override={}

domain-admin.initialize.clients=

oidc.authorizationUrl=https://irma-auth.sns.gidsopenstandaarden.org/oauth2/authorize
oidc.tokenUrl=https://irma-auth.sns.gidsopenstandaarden.org/oauth2/token
oidc.clientId=epd-client-id

fhir.smart.service.fhirServerUrl=https://fhir-server.koppeltaal.headease.nl/fhir/DEFAULT
fhir.smart.service.deviceRef=Device/${fhir.smart.service.clientId}
fhir.smart.service.scope=*/read
fhir.smart.service.metaSourceUuid=${fhir.smart.service.deviceRef}

# Mail about automatically deactivated applications (SMTP settings as in Keycloak). Without spring.mail.host nothing is
# sent and the mail is logged instead.
#spring.mail.host=
#spring.mail.port=587
#spring.mail.username=
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
# JavaMail waits forever by default; a stalled mail server must not hold the deactivation endpoint
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
deactivation.mail.from=
# Replies to the deactivation mails go to Koppeltaal beheer
deactivation.mail.reply-to=info@headease.nl
# Who may suspend an application and lift a suspension, by the email they log in with (comma-separated). They also get
# the deactivation mails.
suspension.admins=joris@headease.nl,roland@headease.nl

# Secrets are loaded from application-secrets.properties
# See application-secrets.properties.example for template
